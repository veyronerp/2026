<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2026</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #16202c; --muted: #5d6b7a;
    --line: #dde3ea; --accent: #0b5cad; --good: #1a7f37; --warn: #b35900; --bad: #c62828;
    --bar-bg: #e8edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141a; --card: #18202a; --text: #e8edf3; --muted: #95a3b3;
      --line: #2a3542; --accent: #5aa9ff; --good: #4cc26a; --warn: #f0a050; --bad: #ff6b6b; --bar-bg: #243040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  .dot.off { background: var(--muted); } .dot.err { background: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .6s; }
  .cand { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .cand:first-child { border-top: 0; }
  .foto { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--bar-bg); }
  .nome { font-weight: 650; font-size: 17px; }
  .partido { color: var(--muted); font-size: 12px; }
  .pct { font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .votos { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .delta { color: var(--good); font-size: 12px; text-align: right; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px;
    background: var(--good); color: #fff; margin-left: 6px; vertical-align: middle; }
  .tag.t2 { background: var(--warn); }
  .cand .bar { height: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi .l { color: var(--muted); font-size: 12px; } .kpi .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .p { color: var(--muted); font-size: 12px; }
  .vantagem { font-size: 15px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  .scroll { overflow-x: auto; }
  .erro { border-color: var(--bad); color: var(--bad); }
  details summary { cursor: pointer; color: var(--muted); }
  .cfg { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 10px; }
  .cfg label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  input, select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 100%; }
  .hidden { display: none; }
  @media (max-width: 520px) { .pct { font-size: 21px; } .big { font-size: 24px; } .cand { grid-template-columns: 44px 1fr auto; } .foto { width: 44px; height: 44px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="titulo">Apuração 2026</h1>
      <div class="sub" id="subtitulo">Dados oficiais: resultados.tse.jus.br</div>
    </div>
    <div class="controls">
      <span class="status"><span class="dot off" id="dot"></span><span id="status">iniciando…</span></span>
      <button id="btnPausa">Pausar</button>
      <button id="btnAgora" class="primary">Atualizar agora</button>
    </div>
  </header>

  <div class="card erro hidden" id="erro"></div>

  <div class="card">
    <div class="progress-top">
      <div><div class="sub">Seções totalizadas</div><div class="big" id="pst">–</div></div>
      <div style="text-align:right"><div class="sub">Última totalização do TSE</div><div id="hg" style="font-weight:600">–</div></div>
    </div>
    <div class="bar"><span id="pstBar" style="width:0"></span></div>
    <div class="sub" id="secoes" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div id="cands"><div class="sub">Carregando candidatos…</div></div>
    <div class="vantagem" id="vantagem"></div>
  </div>

  <div class="card">
    <div class="grid" id="kpis"></div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:6px">Histórico desta sessão (cada vez que o TSE publicou dados novos)</div>
    <div class="scroll"><table id="hist"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <details>
      <summary>Configurar eleição / estado / cargo</summary>
      <div class="cfg">
        <label style="grid-column: 1 / -1">Colar link do site do TSE
          <input id="cfgLink" placeholder="https://resultados.tse.jus.br/oficial/app/index.html#/eleicao/6258/uf/br/cargo/1/...">
        </label>
        <label>Código da eleição <input id="cfgEle" inputmode="numeric"></label>
        <label>UF (br = Brasil) <input id="cfgUf" maxlength="2"></label>
        <label>Cargo
          <select id="cfgCargo">
            <option value="1">Presidente</option>
            <option value="3">Governador</option>
            <option value="5">Senador</option>
          </select>
        </label>
        <label>Ciclo (deixe vazio = automático) <input id="cfgCiclo" placeholder="ele2026"></label>
      </div>
      <div style="margin-top:10px"><button id="btnAplicar" class="primary">Aplicar</button></div>
    </details>
    <div class="sub" style="margin-top:10px">Fonte: <a id="fonte" href="#" target="_blank" rel="noopener">arquivo JSON do TSE</a>. Atualiza a cada 10 segundos.</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var INTERVALO = 10; // segundos
  var TSE = "https://resultados.tse.jus.br";
  // Quando aberto pelo monitor.py (localhost), as requisições passam pelo proxy local (evita bloqueio de CORS).
  var viaProxy = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var BASE = viaProxy ? "/tse" : TSE;
  var CARGOS = { 1: "Presidente", 3: "Governador", 5: "Senador", 6: "Deputado Federal", 7: "Deputado Estadual" };

  var cfg = lerConfig();
  var ciclo = cfg.ciclo || null;
  var pausado = false, restante = 0, buscando = false;
  var ultimo = null;          // último JSON recebido
  var anteriorVotos = {};     // sqcand -> votos na leitura anterior com dados novos
  var deltas = {};
  var historico = [];

  var $ = function (id) { return document.getElementById(id); };

  function lerConfig() {
    var p = new URLSearchParams(location.search);
    var c = { ele: "6258", uf: "br", cargo: "1", ciclo: "" };
    try {
      var s = JSON.parse(localStorage.getItem("apuracao-cfg") || "{}");
      for (var k in s) if (s[k]) c[k] = s[k];
    } catch (e) {}
    ["ele", "uf", "cargo", "ciclo"].forEach(function (k) { if (p.get(k)) c[k] = p.get(k); });
    c.uf = c.uf.toLowerCase();
    return c;
  }

  function salvarConfig() {
    try { localStorage.setItem("apuracao-cfg", JSON.stringify(cfg)); } catch (e) {}
  }

  function pad(n, len) { n = String(n); while (n.length < len) n = "0" + n; return n; }
  function int(x) { return parseInt(String(x == null ? "" : x).replace(/\D/g, ""), 10) || 0; }
  function pct(x) { return parseFloat(String(x == null ? "" : x).replace(/\./g, "").replace(",", ".")) || 0; }
  function fmt(n) { return n.toLocaleString("pt-BR"); }
  function fmtPct(n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }

  function urlResultado() {
    return BASE + "/oficial/" + ciclo + "/" + cfg.ele + "/dados-simplificados/" + cfg.uf + "/" +
      cfg.uf + "-c" + pad(cfg.cargo, 4) + "-e" + pad(cfg.ele, 6) + "-r.json";
  }
  function urlFoto(sq) { return BASE + "/oficial/" + ciclo + "/" + cfg.ele + "/fotos/" + cfg.uf + "/" + sq + ".jpeg"; }

  function getJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " em " + url.replace(BASE, TSE));
      return r.json();
    });
  }

  function descobrirCiclo() {
    if (ciclo) return Promise.resolve(ciclo);
    return getJSON(BASE + "/oficial/comum/config/ele-c.json").then(function (j) {
      ciclo = (j && j.c) || "ele2026";
      try {
        (j.pl || []).forEach(function (pl) {
          (pl.e || []).forEach(function (e) {
            if (String(int(e.cd)) === String(int(cfg.ele)) && e.nm) $("subtitulo").textContent = e.nm + " · " + (pl.dt || "");
          });
        });
      } catch (e) {}
      return ciclo;
    }).catch(function () { ciclo = "ele2026"; return ciclo; });
  }

  function mostrarErro(msg) {
    var el = $("erro");
    if (!msg) { el.classList.add("hidden"); return; }
    el.innerHTML = msg;
    el.classList.remove("hidden");
  }

  function atualizar() {
    if (buscando) return;
    buscando = true;
    $("btnAgora").disabled = true;
    $("status").textContent = "buscando…";
    descobrirCiclo().then(function () {
      $("fonte").href = urlResultado().replace(BASE, TSE);
      return getJSON(urlResultado());
    }).then(function (d) {
      mostrarErro(null);
      $("dot").className = "dot";
      processar(d);
    }).catch(function (e) {
      $("dot").className = "dot err";
      var dica = "";
      if (!viaProxy && e instanceof TypeError) {
        dica = "<br><br>O navegador bloqueou o acesso direto ao TSE (CORS). Rode o <b>monitor.py</b> " +
          "(veja o README) e abra <b>http://localhost:8000</b>.";
      }
      mostrarErro("Não foi possível obter os dados: " + esc(e.message) + dica);
    }).then(function () {
      buscando = false;
      restante = INTERVALO;
      // botão "atualizar agora" respeita o mínimo de 10 s entre consultas
      setTimeout(function () { $("btnAgora").disabled = false; }, INTERVALO * 1000);
      tick();
    });
  }

  function processar(d) {
    var novo = !ultimo || ultimo.hg !== d.hg || ultimo.dg !== d.dg || ultimo.st !== d.st;
    var cands = (d.cand || []).map(function (c) {
      return { sq: c.sqcand, n: c.n, nome: c.nm || c.nmu || c.nv || "", cc: c.cc || "", st: c.st || "",
        eleito: c.e === "s", votos: int(c.vap), pct: pct(c.pvap) };
    }).sort(function (a, b) { return b.votos - a.votos || a.n - b.n; });

    if (novo && ultimo) {
      deltas = {};
      cands.forEach(function (c) { if (c.sq in anteriorVotos) deltas[c.sq] = c.votos - anteriorVotos[c.sq]; });
    }
    if (novo) {
      anteriorVotos = {};
      cands.forEach(function (c) { anteriorVotos[c.sq] = c.votos; });
      historico.unshift({ hora: d.hg || "", pst: pct(d.pst), top: cands.slice(0, 4).map(function (c) { return c.pct; }) });
      if (historico.length > 200) historico.pop();
    }
    ultimo = d;

    var cargoNome = CARGOS[int(cfg.cargo)] || ("Cargo " + cfg.cargo);
    var local = cfg.uf === "br" ? "Brasil" : cfg.uf.toUpperCase();
    var turno = d.t ? d.t + "º turno" : "";
    $("titulo").textContent = cargoNome + " · " + local + (turno ? " · " + turno : "");

    var ps = pct(d.pst);
    $("pst").textContent = fmtPct(ps);
    $("pstBar").style.width = Math.min(ps, 100) + "%";
    $("hg").textContent = (d.dg || "") + " " + (d.hg || "");
    $("secoes").textContent = fmt(int(d.st)) + " de " + fmt(int(d.s)) + " seções totalizadas";

    var htm = cands.map(function (c) {
      var tag = "";
      if (c.eleito) tag = '<span class="tag">' + esc(c.st || "Eleito") + "</span>";
      else if (/2/.test(c.st)) tag = '<span class="tag t2">' + esc(c.st) + "</span>";
      var dl = deltas[c.sq] ? '<div class="delta">+' + fmt(deltas[c.sq]) + " na última atualização</div>" : "";
      return '<div class="cand">' +
        '<img class="foto" alt="" loading="lazy" src="' + esc(urlFoto(c.sq)) + '" onerror="this.style.visibility=\'hidden\'">' +
        "<div><div class=\"nome\">" + esc(c.nome) + " <span class=\"partido\">" + esc(c.n) + "</span>" + tag + "</div>" +
        '<div class="partido">' + esc(c.cc) + "</div>" +
        '<div class="bar"><span style="width:' + Math.min(c.pct, 100) + '%"></span></div></div>' +
        '<div><div class="pct">' + fmtPct(c.pct) + '</div><div class="votos">' + fmt(c.votos) + " votos</div>" + dl + "</div>" +
        "</div>";
    }).join("");
    $("cands").innerHTML = htm || '<div class="sub">Sem candidatos no arquivo.</div>';

    if (cands.length >= 2) {
      var v = cands[0].votos - cands[1].votos;
      $("vantagem").innerHTML = "Vantagem de <b>" + esc(cands[0].nome) + "</b> sobre " + esc(cands[1].nome) +
        ": <b>" + fmt(v) + "</b> votos (" + fmtPct(cands[0].pct - cands[1].pct).replace("%", " p.p.") + ")";
    } else $("vantagem").textContent = "";

    var kpis = [
      ["Eleitorado", int(d.e), null],
      ["Comparecimento", int(d.c), pct(d.pc)],
      ["Abstenção", int(d.a), pct(d.pa)],
      ["Votos válidos", int(d.vv), pct(d.pvv)],
      ["Brancos", int(d.vb), pct(d.pvb)],
      ["Nulos", int(d.tvn || d.vn), pct(d.ptvn || d.pvn)]
    ];
    $("kpis").innerHTML = kpis.map(function (k) {
      return '<div class="kpi"><div class="l">' + k[0] + '</div><div class="v">' + fmt(k[1]) + "</div>" +
        (k[2] != null ? '<div class="p">' + fmtPct(k[2]) + "</div>" : "") + "</div>";
    }).join("");

    var top = cands.slice(0, 4);
    $("hist").querySelector("thead").innerHTML = "<tr><th>Hora TSE</th><th>Seções</th>" +
      top.map(function (c) { return "<th>" + esc(c.nome) + "</th>"; }).join("") + "</tr>";
    $("hist").querySelector("tbody").innerHTML = historico.map(function (h) {
      return "<tr><td>" + esc(h.hora) + "</td><td>" + fmtPct(h.pst) + "</td>" +
        top.map(function (c, i) { return "<td>" + (h.top[i] != null ? fmtPct(h.top[i]) : "") + "</td>"; }).join("") + "</tr>";
    }).join("");

    if (cands.length) document.title = cands[0].nome + " " + fmtPct(cands[0].pct) + " · " + fmtPct(ps) + " apurado";
  }

  function tick() {
    if (pausado) { $("status").textContent = "pausado"; $("dot").className = "dot off"; return; }
    if (buscando) return;
    $("status").textContent = "próxima atualização em " + restante + "s";
  }

  setInterval(function () {
    if (pausado || buscando) return;
    restante--;
    if (restante <= 0) atualizar(); else tick();
  }, 1000);

  $("btnAgora").onclick = function () { atualizar(); };
  $("btnPausa").onclick = function () {
    pausado = !pausado;
    $("btnPausa").textContent = pausado ? "Continuar" : "Pausar";
    if (!pausado) { $("dot").className = "dot"; restante = 1; }
    tick();
  };

  $("cfgEle").value = cfg.ele; $("cfgUf").value = cfg.uf; $("cfgCargo").value = cfg.cargo; $("cfgCiclo").value = cfg.ciclo;
  $("cfgLink").oninput = function () {
    var m = this.value.match(/eleicao\/(\d+)\/uf\/([a-z]{2})\/cargo\/(\d+)/i);
    if (m) { $("cfgEle").value = m[1]; $("cfgUf").value = m[2].toLowerCase(); $("cfgCargo").value = String(int(m[3])); }
  };
  $("btnAplicar").onclick = function () {
    cfg = { ele: String(int($("cfgEle").value) || 6258), uf: ($("cfgUf").value || "br").toLowerCase(),
      cargo: $("cfgCargo").value, ciclo: $("cfgCiclo").value.trim() };
    ciclo = cfg.ciclo || null;
    salvarConfig();
    ultimo = null; anteriorVotos = {}; deltas = {}; historico = [];
    $("cands").innerHTML = '<div class="sub">Carregando…</div>';
    atualizar();
  };

  atualizar();
})();
</script>
</body>
</html>
