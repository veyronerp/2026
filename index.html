<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuração 2026</title>
<meta name="theme-color" content="#0f141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apuração 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --text: #16202c; --muted: #5d6b7a; --line: #dde3ea;
    --bar-bg: #e6ebf1; --accent: #0b5cad; --ok: #1a7f37; --bad: #c62828;
    --lula: #d32f2f; --flavio: #1565c0; --c1: #7b1fa2; --c2: #00897b; --c3: #ef6c00; --outro: #7b8794;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141a; --card: #18202a; --text: #e9eef4; --muted: #95a3b3; --line: #2a3542;
      --bar-bg: #243040; --accent: #5aa9ff; --ok: #4cc26a; --bad: #ff6b6b;
      --lula: #ef5350; --flavio: #42a5f5; --c1: #ba68c8; --c2: #26a69a; --c3: #ffa726; --outro: #8a96a3; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 8px 10px 24px; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .topo h1 { font-size: 16px; margin: 0; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.err { background: var(--bad); }
  .tela { font: inherit; font-size: 11px; padding: 3px 7px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); }
  .tela.on { color: var(--ok); border-color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; margin-top: 7px; }
  .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .cab .t { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
  .cab .a { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cab .a b { color: var(--text); font-size: 14px; }
  .prog { height: 3px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .prog > span { display: block; height: 100%; background: var(--accent); transition: width .6s; }
  .muted { color: var(--muted); font-size: 11px; }

  /* duelo de dois candidatos (Brasil e ES) */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 7px; }
  .c { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .c.dir { flex-direction: row-reverse; text-align: right; }
  .duo { --fs: clamp(38px, 12vw, 54px); --ps: clamp(20px, 6.8vw, 30px); }
  .foto { width: var(--fs); height: var(--fs); border-radius: 50%; object-fit: cover; flex: none;
    border: 3px solid var(--cor); background: var(--bar-bg); }
  .inicial { width: var(--fs); height: var(--fs); border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--cor); color: #fff; font-size: 22px; font-weight: 700; }
  .c .info { min-width: 0; flex: 1; }
  .c .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c .pc { font-size: var(--ps); font-weight: 800; color: var(--cor); font-variant-numeric: tabular-nums; line-height: 1.05; }
  .c .vt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .c .vt .g { color: var(--ok); }
  .selo { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 6px;
    background: var(--cor); color: #fff; vertical-align: 2px; margin: 0 3px; }
  .split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bar-bg); margin-top: 7px; }
  .split > span { height: 100%; transition: width .6s; }
  .linha { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; margin-top: 5px; flex-wrap: wrap; }
  .gov .duo { --fs: clamp(32px, 10vw, 42px); --ps: clamp(18px, 5.8vw, 24px); }

  /* grade de estados */
  .ordem { display: flex; gap: 4px; }
  .ordem button { white-space: nowrap; font: inherit; font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); }
  .ordem button.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
  .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 7px; }
  @media (min-width: 560px) { .grade { grid-template-columns: repeat(6, 1fr); } }
  @media (max-width: 330px) { .grade { grid-template-columns: repeat(3, 1fr); } }
  .uf { border: 1px solid var(--line); border-radius: 8px; padding: 4px 5px; min-width: 0; }
  .uf.es { border-color: var(--accent); }
  .uf .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; color: var(--muted); }
  .uf .t b { font-size: 12px; color: var(--text); }
  .uf .split { height: 7px; margin-top: 3px; border-radius: 4px; }
  .uf .n { display: flex; justify-content: space-between; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .uf .n .l { font-weight: 800; }
  .uf .df { font-size: 10px; letter-spacing: -.2px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha .dif { font-size: 15px; font-variant-numeric: tabular-nums; }

  .erro { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .hidden { display: none !important; }
  .nova { position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff; text-align: center;
    padding: 10px; font-size: 14px; cursor: pointer; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .cfg { display: grid; gap: 6px; margin-top: 8px; }
  .cfg label { font-size: 11px; color: var(--muted); display: grid; gap: 3px; }
  input { font: inherit; padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
  .btn { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  @media (min-width: 560px) { .duo { --fs: 72px; --ps: 36px; } .gov .duo { --fs: 54px; --ps: 28px; } }
</style>
</head>
<body>
<div class="nova hidden" id="nova">Nova versão do app. <b>Toque aqui para atualizar</b></div>
<div class="wrap">
  <div class="topo">
    <h1>Apuração 2026</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">carregando…</span>
      <button class="tela" id="btnTela" title="Manter a tela do celular ligada">tela ligada</button></div>
  </div>

  <!-- Presidente · Brasil -->
  <div class="card">
    <div class="cab"><span class="t" id="brTit">Presidente · Brasil</span><span class="a"><b id="brPst">–</b> apurado</span></div>
    <div class="prog"><span id="brProg" style="width:0"></span></div>
    <div class="duo" id="brDuo"></div>
    <div class="split" id="brSplit"></div>
    <div class="linha"><span id="brVant"></span><span class="muted" id="brHora"></span></div>
    <div class="erro hidden" id="brErro"></div>
  </div>

  <!-- Governador · Espírito Santo -->
  <div class="card gov">
    <div class="cab"><span class="t" id="esTit">Governador · Espírito Santo</span><span class="a"><b id="esPst">–</b> apurado</span></div>
    <div class="prog"><span id="esProg" style="width:0"></span></div>
    <div class="duo" id="esDuo"><div class="muted">Carregando…</div></div>
    <div class="split" id="esSplit"></div>
    <div class="linha"><span id="esVant"></span><span class="muted" id="esHora"></span></div>
  </div>

  <!-- Presidente por estado -->
  <div class="card">
    <div class="cab"><span class="t">Por estado <span style="text-transform:none;font-weight:400">+ = dif. votos</span></span>
      <div class="ordem" id="ordem"><button data-o="az" class="sel">A–Z</button><button data-o="apur">%</button><button data-o="eleit">eleit.</button></div>
    </div>
    <div class="grade" id="estados"></div>
  </div>

  <div class="card">
    <button id="btnInstalar" class="btn hidden" style="margin-bottom:8px">Instalar app</button>
    <details>
      <summary>Configurar eleição</summary>
      <div class="cfg">
        <label>Colar link do site do TSE <input id="cfgLink" placeholder="…#/eleicao/6258/uf/br/cargo/1/…"></label>
        <label>Código da eleição <input id="cfgEle" inputmode="numeric"></label>
        <label>Ciclo (vazio = automático) <input id="cfgCiclo" placeholder="ele2026"></label>
        <div><button id="btnAplicar" class="btn">Aplicar</button></div>
      </div>
    </details>
    <div class="muted" style="margin-top:8px">Dados oficiais de resultados.tse.jus.br, atualizados a cada 10 s. <span id="fonteInfo"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var INTERVALO = 10;
  var TSE = "https://resultados.tse.jus.br";
  var MEU_UF = "es";   // governador em destaque
  var UFS = [["ac","Acre"],["al","Alagoas"],["ap","Amapá"],["am","Amazonas"],["ba","Bahia"],["ce","Ceará"],
    ["df","Distrito Federal"],["es","Espírito Santo"],["go","Goiás"],["ma","Maranhão"],["mt","Mato Grosso"],
    ["ms","Mato Grosso do Sul"],["mg","Minas Gerais"],["pa","Pará"],["pb","Paraíba"],["pr","Paraná"],
    ["pe","Pernambuco"],["pi","Piauí"],["rj","Rio de Janeiro"],["rn","Rio Grande do Norte"],["rs","Rio Grande do Sul"],
    ["ro","Rondônia"],["rr","Roraima"],["sc","Santa Catarina"],["sp","São Paulo"],["se","Sergipe"],["to","Tocantins"],
    ["zz","Exterior"]];

  // Onde buscar os arquivos do TSE. Primeiro direto; se o navegador bloquear (CORS), tenta proxies públicos.
  var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var FONTES = local ? [{ nome: "monitor.py", url: function (p) { return "/tse" + p; } }] : [
    { nome: "direto do TSE", url: function (p) { return TSE + p; } },
    { nome: "proxy allorigins", url: function (p) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(TSE + p + "?t=" + Date.now()); } },
    { nome: "proxy corsproxy", url: function (p) { return "https://corsproxy.io/?url=" + encodeURIComponent(TSE + p + "?t=" + Date.now()); } },
    { nome: "proxy codetabs", url: function (p) { return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(TSE + p + "?t=" + Date.now()); } }
  ];
  var fonte = 0;

  var cfg = lerConfig();
  var ciclo = cfg.ciclo || null;
  var eleicoes = [];        // códigos de eleição listados na configuração do TSE
  var govEle = null;        // eleição onde foi achado o governador do ES (2º turno, ou 1º se já decidido)
  var restante = 0, buscando = false;
  var paineis = { br: novoPainel(), gov: novoPainel() };
  var estados = {};
  var ordem = "az";
  var $ = function (id) { return document.getElementById(id); };

  function novoPainel() { return { ult: null, ant: {}, ganho: {} }; }

  function lerConfig() {
    var c = { ele: "6258", ciclo: "" };
    try { var s = JSON.parse(localStorage.getItem("apuracao-cfg2") || "{}"); if (s.ele) c.ele = s.ele; if (s.ciclo) c.ciclo = s.ciclo; } catch (e) {}
    var p = new URLSearchParams(location.search);
    if (p.get("ele")) c.ele = p.get("ele");
    if (p.get("ciclo")) c.ciclo = p.get("ciclo");
    return c;
  }

  function pad(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; }
  function int(x) { return parseInt(String(x == null ? "" : x).replace(/\D/g, ""), 10) || 0; }
  function pct(x) { return parseFloat(String(x == null ? "" : x).replace(/\./g, "").replace(",", ".")) || 0; }
  function fmt(n) { return n.toLocaleString("pt-BR"); }
  function fp(n, d) { d = d == null ? 2 : d; return n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase(); }
  function titulo(s) {
    return String(s || "").toLowerCase().replace(/(^|\s)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); })
      .replace(/\s(De|Da|Do|Dos|Das|E)\s/g, function (m) { return m.toLowerCase(); });
  }

  function corPresidente(c) {
    var n = norm(c.nome);
    if (/LULA/.test(n) || c.n === "13") return "var(--lula)";
    if (/FLAVIO|BOLSONARO/.test(n) || c.n === "22") return "var(--flavio)";
    return "var(--outro)";
  }
  // governador: PT vermelho, PL azul, os demais com cores próprias
  function coresGov(cs) {
    var pal = ["var(--c1)", "var(--c2)", "var(--c3)"], k = 0;
    cs.forEach(function (c) { c.cor = c.n.slice(0, 2) === "13" ? "var(--lula)" : c.n.slice(0, 2) === "22" ? "var(--flavio)" : (pal[k++] || "var(--outro)"); });
  }
  function apelido(c) {
    var n = norm(c.nome);
    if (/^LULA/.test(n)) return "Lula";
    if (/^FLAVIO/.test(n)) return "Flávio";
    return titulo(c.nome);
  }

  function caminho(ele, uf, cargo) {
    return "/oficial/" + ciclo + "/" + ele + "/dados-simplificados/" + uf + "/" + uf + "-c" + pad(cargo, 4) + "-e" + pad(ele, 6) + "-r.json";
  }
  function urlFoto(ele, uf, sq) { return (local ? "/tse" : TSE) + "/oficial/" + ciclo + "/" + ele + "/fotos/" + uf + "/" + sq + ".jpeg"; }

  function tentar(url) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 9000);
    return fetch(url, { cache: "no-store", signal: ctl.signal }).then(function (r) {
      clearTimeout(t);
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.text();
    }).then(function (txt) { return JSON.parse(txt); });
  }

  // Busca um arquivo do TSE usando a fonte que está funcionando; se falhar, tenta as outras.
  function getJSON(p) {
    var ordemF = [fonte];
    for (var i = 0; i < FONTES.length; i++) if (i !== fonte) ordemF.push(i);
    var primeiroErro = null;
    function prox(k) {
      if (k >= ordemF.length) return Promise.reject(primeiroErro);
      var idx = ordemF[k];
      return tentar(FONTES[idx].url(p)).then(function (j) { fonte = idx; return j; }, function (e) {
        if (!primeiroErro) primeiroErro = e;
        return prox(k + 1);
      });
    }
    return prox(0);
  }

  // Lê a configuração do TSE: o ciclo (ex.: ele2026) fica em cada pleito, e o governador é uma
  // eleição separada da de presidente (2026: presidente 6257/6258, governador 6259/6260).
  function lerConfigTSE() {
    if (ciclo && eleicoes.length) return Promise.resolve();
    return getJSON("/oficial/comum/config/ele-c.json").then(function (j) {
      var gov1 = [], gov2 = [];
      (j.pl || []).forEach(function (pl) {
        (pl.e || []).forEach(function (e) {
          if (int(e.cd) === int(cfg.ele) || int(e.cdt2) === int(cfg.ele)) { if (!cfg.ciclo && pl.c) ciclo = pl.c; }
        });
      });
      if (!ciclo) ciclo = "ele2026";
      (j.pl || []).forEach(function (pl) {
        if (pl.c && pl.c !== ciclo) return;
        (pl.e || []).forEach(function (e) {
          var temGov = (e.abr || []).some(function (a) { return (a.cp || []).some(function (cp) { return String(cp.cd) === "3"; }); });
          if (!temGov) return;
          if (int(e.t) === 2) gov2.push(int(e.cd)); else { gov1.push(int(e.cd)); if (int(e.cdt2)) gov2.push(int(e.cdt2)); }
        });
      });
      eleicoes = gov2.concat(gov1);
    }).catch(function () { if (!ciclo) ciclo = "ele2026"; });
  }

  function cands(d) {
    return (d.cand || []).map(function (c) {
      return { sq: c.sqcand, n: String(c.n), nome: c.nm || c.nmu || c.nv || "", st: c.st || "", eleito: c.e === "s",
        votos: int(c.vap), pct: pct(c.pvap) };
    }).sort(function (a, b) { return int(a.n) - int(b.n); });
  }
  function lider(cs) { var l = null; cs.forEach(function (c) { if (c.votos > 0 && (!l || c.votos > l.votos)) l = c; }); return l; }
  function difVotos(cs) { var r = porVotos(cs); return r.length >= 2 ? r[0].votos - r[1].votos : 0; }
  function porVotos(cs) { return cs.slice().sort(function (a, b) { return b.votos - a.votos; }); }
  function splitBar(cs) {
    return cs.map(function (c) { return '<span style="width:' + Math.max(0, c.pct) + '%;background:' + c.cor + '"></span>'; }).join("");
  }

  // ---------------------------------------------------------------- fotos
  // Ordem: cópia da foto do TSE guardada neste site (pasta fotos/), foto direto do TSE,
  // foto da Wikipédia (Lula e Flávio) e, por fim, a inicial colorida. Fotos que falharem
  // são tentadas de novo a cada minuto. As fotos nunca atrasam a atualização dos números.
  var fotoOk = {};      // sqcand -> url que carregou
  var fotoFalhou = {};  // sqcand -> hora da última falha
  var wikiProm = {};    // sqcand -> busca da foto na Wikipédia
  function wikiTitulo(c) {
    var n = norm(c.nome);
    if (/^LULA/.test(n)) return "Luiz Inácio Lula da Silva";
    if (/^FLAVIO/.test(n) && (/BOLSONARO/.test(n) || c.n === "22")) return "Flávio Bolsonaro";
    return "";
  }
  function inicialHTML(c) { return '<div class="inicial">' + esc(apelido(c).charAt(0)) + "</div>"; }
  function fotoHTML(c, ele, uf) {
    if (!fotoOk[c.sq] && fotoFalhou[c.sq] && Date.now() - fotoFalhou[c.sq] < 60000) return inicialHTML(c);
    var fontes = fotoOk[c.sq] ? [fotoOk[c.sq]] : ["fotos/" + c.sq + ".jpg", urlFoto(ele, uf, c.sq)];
    return '<img class="foto" alt="' + esc(apelido(c)) + '" src="' + esc(fontes[0]) + '" data-sq="' + esc(c.sq) +
      '" data-fontes="' + esc(fontes.join(" ")) + '" data-i="0" data-wiki="' + (fotoOk[c.sq] ? "" : esc(wikiTitulo(c))) +
      '" data-ini="' + esc(apelido(c).charAt(0)) + '" onload="fotoCarregou(this)" onerror="fotoErro(this)">';
  }
  window.fotoCarregou = function (img) { fotoOk[img.getAttribute("data-sq")] = img.src; };
  window.fotoErro = function (img) {
    var sq = img.getAttribute("data-sq"), w = img.getAttribute("data-wiki");
    var fontes = img.getAttribute("data-fontes").split(" "), i = int(img.getAttribute("data-i")) + 1;
    function semFoto() {
      delete fotoOk[sq];
      fotoFalhou[sq] = Date.now();
      var d = document.createElement("div"); d.className = "inicial"; d.textContent = img.getAttribute("data-ini");
      if (img.parentNode) img.parentNode.replaceChild(d, img);
    }
    if (i < fontes.length) { img.setAttribute("data-i", i); img.src = fontes[i]; return; }
    if (!w) return semFoto();
    img.setAttribute("data-wiki", "");
    if (!wikiProm[sq]) {
      wikiProm[sq] = fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(w.replace(/ /g, "_")))
        .then(function (r) { return r.json(); })
        .then(function (j) { return j && (j.thumbnail && j.thumbnail.source || j.originalimage && j.originalimage.source) || ""; })
        .catch(function () { delete wikiProm[sq]; return ""; });
    }
    wikiProm[sq].then(function (u) { if (u) img.src = u; else semFoto(); });
  };

  // Desenha um painel com os dois principais candidatos (usado para Presidente e Governador).
  function renderDuelo(px, painel, d, cs, ele, uf, ordemFixa) {
    var novo = !painel.ult || painel.ult.hg !== d.hg || painel.ult.st !== d.st;
    if (novo && painel.ult) { painel.ganho = {}; cs.forEach(function (c) { if (c.sq in painel.ant) painel.ganho[c.sq] = c.votos - painel.ant[c.sq]; }); }
    if (novo) { painel.ant = {}; cs.forEach(function (c) { painel.ant[c.sq] = c.votos; }); }
    painel.ult = d;

    var ps = pct(d.pst);
    $(px + "Pst").textContent = fp(ps);
    $(px + "Prog").style.width = Math.min(ps, 100) + "%";
    $(px + "Hora").textContent = "TSE " + (d.hg || "");

    var rk = porVotos(cs), l = lider(cs);
    var dois = rk.slice(0, 2);
    if (ordemFixa) dois.sort(function (a, b) { return int(a.n) - int(b.n); });
    $(px + "Duo").innerHTML = dois.map(function (c, i) {
      var selo = c.eleito ? "ELEITO" : (/2/.test(c.st) ? "2º TURNO" : (l === c ? "À FRENTE" : ""));
      var g = painel.ganho[c.sq] ? ' <span class="g">+' + fmt(painel.ganho[c.sq]) + "</span>" : "";
      var nome = esc(apelido(c));
      return '<div class="c' + (i === 1 ? " dir" : "") + '" style="--cor:' + c.cor + '">' +
        fotoHTML(c, ele, uf) +
        '<div class="info"><div class="nm">' + (selo ? '<span class="selo">' + selo + "</span>" : "") + nome + "</div>" +
        '<div class="pc">' + fp(c.pct) + "</div>" +
        '<div class="vt">' + fmt(c.votos) + g + "</div></div></div>";
    }).join("") || '<div class="muted">Sem candidatos no arquivo.</div>';
    $(px + "Split").innerHTML = splitBar(cs);
    $(px + "Vant").innerHTML = rk.length >= 2 && rk[0].votos > 0
      ? 'Diferença: <b class="dif" style="color:' + rk[0].cor + '">' + fmt(rk[0].votos - rk[1].votos) + " votos</b> p/ " +
        '<b style="color:' + rk[0].cor + '">' + esc(apelido(rk[0])) + "</b>"
      : "";
    return l;
  }

  // ---------------------------------------------------------------- estados
  function renderEstados() {
    var lista = UFS.map(function (u) { return { uf: u[0], nome: u[1], d: estados[u[0]] }; });
    if (ordem === "apur") lista.sort(function (a, b) { return (b.d ? b.d.pst : -1) - (a.d ? a.d.pst : -1); });
    if (ordem === "eleit") lista.sort(function (a, b) { return (b.d ? b.d.e : -1) - (a.d ? a.d.e : -1); });
    $("estados").innerHTML = lista.map(function (x) {
      var d = x.d;
      var h = '<div class="uf' + (x.uf === MEU_UF ? " es" : "") + '" title="' + esc(x.nome) + '"><div class="t"><b>' + x.uf.toUpperCase() + "</b>" +
        "<span>" + (d ? fp(d.pst, 0) : (d === null ? "s/ dados" : "…")) + "</span></div>";
      if (!d) return h + '<div class="split"></div><div class="n">&nbsp;</div><div class="df">&nbsp;</div></div>';
      var l = lider(d.cs), dois = d.cs.length > 2 ? porVotos(d.cs).slice(0, 2).sort(function (a, b) { return int(a.n) - int(b.n); }) : d.cs;
      return h + '<div class="split">' + splitBar(d.cs) + '</div><div class="n">' + dois.map(function (c) {
        return '<span class="' + (l === c ? "l" : "") + '" style="color:' + c.cor + '">' + fp(c.pct, 1).replace("%", "") + "</span>";
      }).join("") + '</div><div class="df"' + (l ? ' style="color:' + l.cor + '">+' + fmt(difVotos(d.cs)) : ">&nbsp;") + "</div></div>";
    }).join("");
  }

  function buscarEstados() {
    var fila = UFS.map(function (u) { return u[0]; });
    var limite = fonte === 0 || local ? 10 : 4;
    function worker() {
      var uf = fila.shift();
      if (!uf) return Promise.resolve();
      return getJSON(caminho(cfg.ele, uf, 1)).then(function (d) {
        var cs = cands(d); cs.forEach(function (c) { c.cor = corPresidente(c); });
        estados[uf] = { pst: pct(d.pst), e: int(d.e), cs: cs };
      }, function () {
        if (!(uf in estados)) estados[uf] = null;
      }).then(function () { renderEstados(); return worker(); });
    }
    var ws = [];
    for (var i = 0; i < limite; i++) ws.push(worker());
    return Promise.all(ws);
  }

  // ---------------------------------------------------------------- governador do ES
  // Tenta primeiro a eleição atual (2º turno). Se o ES não tiver 2º turno, procura nas outras
  // eleições do ciclo (1º turno) e mostra quem foi eleito.
  function buscarGov() {
    // 2º turno do governador primeiro; se o ES não tiver 2º turno, o 1º turno
    var tentativas = govEle ? [govEle] : (eleicoes.length ? eleicoes : [6260, 6259]);
    tentativas = tentativas.filter(function (e, i, a) { return e > 0 && a.indexOf(e) === i; });
    function prox(k) {
      if (k >= tentativas.length) return Promise.reject(new Error("não encontrado"));
      var ele = tentativas[k];
      return getJSON(caminho(ele, MEU_UF, 3)).then(function (d) {
        if (!d.cand || !d.cand.length) throw new Error("vazio");
        return { ele: ele, d: d };
      }).catch(function () { return prox(k + 1); });
    }
    return prox(0).then(function (r) {
      if (govEle !== r.ele) paineis.gov = novoPainel();
      govEle = r.ele;
      var cs = cands(r.d); coresGov(cs);
      var turno = r.d.t ? r.d.t + "º turno" : "";
      $("esTit").textContent = "Governador · ES" + (turno ? " · " + turno : "");
      renderDuelo("es", paineis.gov, r.d, cs, r.ele, MEU_UF, false);
    }, function () {
      govEle = null;
      if (!paineis.gov.ult) $("esDuo").innerHTML = '<div class="muted">Ainda sem dados do governador do ES.</div>';
    });
  }

  // ---------------------------------------------------------------- ciclo de atualização
  function atualizar() {
    if (buscando) return;
    buscando = true;
    $("status").textContent = "atualizando…";
    lerConfigTSE().then(function () {
      var br = getJSON(caminho(cfg.ele, "br", 1)).then(function (d) {
        $("brErro").classList.add("hidden");
        $("dot").className = "dot on";
        var cs = cands(d); cs.forEach(function (c) { c.cor = corPresidente(c); });
        $("brTit").textContent = "Presidente · Brasil" + (d.t ? " · " + d.t + "º turno" : "");
        var l = renderDuelo("br", paineis.br, d, cs, cfg.ele, "br", true);
        if (l) document.title = apelido(l) + " " + fp(l.pct) + " · " + fp(pct(d.pst)) + " apurado";
      }, function (e) {
        $("dot").className = "dot err";
        $("brErro").classList.remove("hidden");
        $("brErro").textContent = "Não consegui ler os dados do TSE (" + (e && e.message || e) + "). Tentando de novo em 10 s.";
      });
      return Promise.all([br, buscarGov()]).then(buscarEstados);
    }).then(function () {
      buscando = false;
      restante = INTERVALO;
      $("fonteInfo").textContent = "Fonte: " + FONTES[fonte].nome + ".";
      tick();
    });
  }
  function tick() {
    if (!buscando) $("status").textContent = "atualiza em " + restante + "s";
  }
  setInterval(function () {
    if (buscando || document.hidden) return;
    restante--;
    if (restante <= 0) atualizar(); else tick();
  }, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && restante < INTERVALO - 3) atualizar();
  });

  // ---------------------------------------------------------------- controles
  Array.prototype.forEach.call($("ordem").querySelectorAll("button"), function (b) {
    b.onclick = function () {
      ordem = b.getAttribute("data-o");
      Array.prototype.forEach.call($("ordem").children, function (x) { x.classList.toggle("sel", x === b); });
      renderEstados();
    };
  });

  var wake = null, querTela = false;
  function ligarTela() {
    navigator.wakeLock.request("screen").then(function (w) {
      wake = w; $("btnTela").classList.add("on"); $("btnTela").textContent = "tela ligada ✓";
      w.addEventListener("release", function () { if (wake === w) { wake = null; $("btnTela").classList.remove("on"); } });
    }).catch(function () {});
  }
  $("btnTela").onclick = function () {
    if (!("wakeLock" in navigator)) { $("btnTela").textContent = "não suportado"; return; }
    querTela = !querTela;
    if (querTela) ligarTela();
    else { if (wake) wake.release(); wake = null; $("btnTela").classList.remove("on"); $("btnTela").textContent = "tela ligada"; }
  };
  document.addEventListener("visibilitychange", function () { if (!document.hidden && querTela && !wake) ligarTela(); });

  var pedidoInstalar = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); pedidoInstalar = e; $("btnInstalar").classList.remove("hidden");
  });
  $("btnInstalar").onclick = function () {
    if (pedidoInstalar) { pedidoInstalar.prompt(); pedidoInstalar = null; $("btnInstalar").classList.add("hidden"); }
  };

  $("cfgEle").value = cfg.ele; $("cfgCiclo").value = cfg.ciclo;
  $("cfgLink").oninput = function () { var m = this.value.match(/eleicao\/(\d+)/i); if (m) $("cfgEle").value = m[1]; };
  $("btnAplicar").onclick = function () {
    cfg = { ele: String(int($("cfgEle").value) || 6258), ciclo: $("cfgCiclo").value.trim() };
    ciclo = cfg.ciclo || null; eleicoes = []; govEle = null;
    try { localStorage.setItem("apuracao-cfg2", JSON.stringify(cfg)); } catch (e) {}
    paineis = { br: novoPainel(), gov: novoPainel() }; estados = {};
    $("brDuo").innerHTML = ""; $("esDuo").innerHTML = ""; renderEstados();
    atualizar();
  };

  // Avisa quando sair uma versão nova do app (o arquivo versao.txt muda a cada correção).
  var versao = null;
  function checarVersao() {
    fetch("versao.txt?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : null; }).then(function (v) {
      if (!v) return;
      v = v.trim();
      if (versao === null) versao = v;
      else if (v !== versao) $("nova").classList.remove("hidden");
    }).catch(function () {});
  }
  $("nova").onclick = function () { location.reload(); };
  checarVersao();
  setInterval(checarVersao, 60000);

  if ("serviceWorker" in navigator && !local) navigator.serviceWorker.register("sw.js").catch(function () {});

  renderEstados();
  atualizar();
})();
</script>
</body>
</html>
